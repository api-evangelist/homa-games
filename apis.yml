name: Homa Games
description: >-
  Homa Games is a global mobile game developer and publisher headquartered in
  Paris, France, and backed by Northzone. Through its Homa Lab platform the
  company pairs data-driven tooling with creative expertise to help studios
  build commercially successful hyper-casual and hybrid-casual games, having
  worked with more than 1,000 studios to ship 80+ titles that have surpassed one
  billion downloads. Its developer surface centers on the Homa SDK (Homa Belly),
  a no-code Unity meta-SDK that bundles user consent, analytics, ad mediation,
  attribution and A/B ("N-testing") tooling, alongside Homa Lab modules for
  market watching, ideation, creative testing, analytics and the Homa Academy.
  Added to the API Evangelist network as a Northzone portfolio company and
  enriched here with its published developer-surface link properties and a
  domain-security profile; Homa exposes an SDK and developer platform rather
  than a public REST API.
